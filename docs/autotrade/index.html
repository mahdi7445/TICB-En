<title>Auto Trading · ترید خودکار</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:#07070a; --bg2:#0d0d12; --card:#111117; --card2:#17171f; --line:rgba(212,166,42,.20); --line2:rgba(255,255,255,.07);
    --text:#f5f0e4; --muted:#a8a191; --dim:#7b766a;
    --g1:#f8dd86; --g2:#e0b43a; --g3:#a67c12; --gold:linear-gradient(135deg,#f8dd86 0%,#e0b43a 48%,#a67c12 100%);
    --ok:#4ade80; --warn:#f5b942; --danger:#f87171; --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Vazirmatn,Tahoma,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(900px 420px at 50% -120px,rgba(224,180,58,.16),transparent 70%),var(--bg);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
  .top{display:flex;justify-content:flex-end;min-height:34px}
  .langbtn{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--g1);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .hero{text-align:center;padding:4px 0 6px}
  .logo{width:116px;height:116px;border-radius:50%;margin:2px auto 14px;display:block;box-shadow:0 0 0 1px rgba(248,221,134,.35),0 0 38px rgba(224,180,58,.30),0 10px 30px rgba(0,0,0,.6)}
  h1{margin:0;font-size:27px;line-height:1.15;letter-spacing:-.01em;font-weight:800;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{margin:6px 0 0;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  html[dir=rtl] .tag{letter-spacing:0;font-size:12.5px}
  .lead{margin:12px auto 0;max-width:430px;color:var(--muted);font-size:14.5px}
  .pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:rgba(224,180,58,.07);color:var(--g1)}
  .pill.ok{border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.08);color:var(--ok)}
  h2{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--g2);margin:26px 2px 11px;font-weight:700}
  html[dir=rtl] h2{letter-spacing:0;font-size:14px}
  h2::after{content:"";flex:1;height:1px;background:linear-gradient(to right,var(--line),transparent)}
  html[dir=rtl] h2::after{background:linear-gradient(to left,var(--line),transparent)}
  .panel{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:var(--radius);padding:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ben{padding:13px;border-radius:16px;background:var(--card);border:1px solid var(--line2)}
  .ben .i{font-size:20px;line-height:1}
  .ben b{display:block;margin:7px 0 2px;font-size:14px}
  .ben span{font-size:12.5px;color:var(--muted);display:block;line-height:1.45}
  .notice{display:flex;gap:10px;padding:13px 14px;border-radius:16px;background:rgba(245,185,66,.09);border:1px solid rgba(245,185,66,.4);margin:14px 0 0;font-size:14px}
  .notice b{color:var(--warn)} .notice .ico{font-size:18px;line-height:1.2}
  .cards{display:grid;gap:11px}
  .ex{position:relative;text-align:start;width:100%;border:1.5px solid var(--line2);background:linear-gradient(180deg,var(--card2),var(--card));color:inherit;border-radius:var(--radius);padding:14px;
    display:grid;grid-template-columns:50px 1fr 24px;gap:13px;align-items:center;font:inherit;cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .1s}
  .ex:active{transform:scale(.985)}
  .ex[aria-checked="true"]{border-color:var(--g2);box-shadow:0 0 0 1px rgba(224,180,58,.35),0 8px 28px rgba(224,180,58,.12)}
  .mono{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:21px;color:#fff;flex:none}
  .mono.nob{background:linear-gradient(135deg,#2f6bff,#8b45f0)} .mono.tob{background:linear-gradient(135deg,#0ea5c6,#14c98a)}
  .ex .name{font-weight:700;font-size:16.5px}
  .ex .aud{font-size:12.5px;font-weight:700;color:var(--g1);margin:1px 0 4px}
  .ex .desc{font-size:12.8px;color:var(--muted);line-height:1.45}
  .ex .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:11.5px;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--muted)}
  .radio{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.22);display:grid;place-items:center;align-self:start;margin-top:2px}
  .ex[aria-checked="true"] .radio{border-color:var(--g2);background:var(--gold)}
  .ex[aria-checked="true"] .radio::after{content:"";width:9px;height:9px;border-radius:50%;background:#1a1405}
  .check{display:grid;grid-template-columns:22px 1fr;gap:11px;align-items:start;cursor:pointer;font-size:14px}
  .check input{width:20px;height:20px;margin:1px 0 0;accent-color:#e0b43a}
  .steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
  .steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;font-size:14px;position:relative;padding-bottom:16px}
  .steps li:last-child{padding-bottom:0}
  .steps li::before{content:attr(data-n);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#1a1405;background:var(--gold);z-index:1}
  .steps li::after{content:"";position:absolute;top:30px;bottom:0;inset-inline-start:14.5px;width:1px;background:linear-gradient(var(--g3),transparent)}
  .steps li:last-child::after{display:none}
  .steps small{display:block;color:var(--muted);font-size:12.8px;margin-top:1px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line2);font-size:14px}
  .kv:first-child{border-top:0} .kv span:first-child{color:var(--muted)} .kv span:last-child{font-weight:600;text-align:end}
  .sec{display:grid;gap:11px;margin:0;padding:0;list-style:none;font-size:13.8px}
  .sec li{display:grid;grid-template-columns:24px 1fr;gap:9px}
  .sec b{color:var(--g1)}
  details{border:1px solid var(--line2);background:var(--card);border-radius:14px;padding:0 14px;margin-bottom:9px}
  summary{cursor:pointer;list-style:none;padding:13px 0;font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";color:var(--g2);font-size:20px;line-height:1;font-weight:400;transition:transform .2s}
  details[open] summary::after{transform:rotate(45deg)}
  details p{margin:0 0 13px;color:var(--muted);font-size:13.5px}
  .locked{text-align:center;padding:20px 16px 8px}
  .locked .mono{margin:0 auto 10px;width:66px;height:66px;font-size:30px;border-radius:21px}
  .locked h3{margin:8px 0 2px;font-size:22px}
  .locked .sub{color:var(--muted);font-size:13px}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:rgba(224,180,58,.08);color:var(--g1)}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 68%,transparent);z-index:5}
  .bar .in{max-width:560px;margin:0 auto}
  .btn{position:relative;overflow:hidden;width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;color:#1a1405;background:var(--gold);
    box-shadow:0 8px 26px rgba(224,180,58,.28);transition:opacity .15s,transform .1s,box-shadow .2s}
  .btn:not([disabled])::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.8s ease-in-out infinite}
  @keyframes shine{0%,55%{left:-80px}100%{left:120%}}
  .btn:active{transform:scale(.985)} .btn[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none}
  .hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:8px;min-height:18px}
  .hidden{display:none !important}
  .foot{text-align:center;margin-top:26px;color:var(--dim);font-size:12px;line-height:1.6}
  .foot b{display:block;color:var(--g2);letter-spacing:.18em;font-size:11px;text-transform:uppercase;margin-bottom:5px}
  html[dir=rtl] .foot b{letter-spacing:0;font-size:12px}
  .skeleton{padding:80px 0;text-align:center;color:var(--muted)}
  .fade{animation:fade .35s ease both} @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (max-width:360px){.grid2{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

      fine: "یک‌بار دیگر در چت تأیید می‌کنید و بعد کلید API را داخل ربات صرافی وصل می‌کنید.",
      pick: "یک صرافی انتخاب کنید", cont: "ادامه با ", hintPick: "صرافی‌ای را که واقعاً در آن معامله می‌کنید انتخاب کنید.", hintAck: "برای ادامه، تیک تأیید را بزنید.",
      fromMenu: "لطفاً این صفحه را از منوی ربات باز کنید.",
      h1: "یک صرافی انتخاب کنید", h1d: "صرافی‌ای که در آن معامله می‌کنید را بزنید. یک‌بار دیگر در چت تأیید می‌کنید.",
      h2: "پذیرش شرایط", h2d: "ربات صرافی را باز کنید و شرایط را یک‌بار بخوانید — حدود یک دقیقه.",
      h3: "اتصال کلید API", h3d: "دسترسی: <b>فقط Read + Trade</b>. هرگز Withdraw را فعال نکنید.",
      h4: "تنظیم ریسک", h4d: "ربات از روی بودجه‌تان تنظیمات امن پیشنهاد می‌دهد؛ بعد معامله خودکار انجام می‌شود.",
      s1: "<b>کلید فقط برای معامله.</b> ربات فقط دسترسی خواندن و معامله می‌خواهد و هرگز برداشت نمی‌کند.",
      s2: "<b>پول پیش خودتان می‌ماند.</b> دارایی هرگز از حساب صرافی خودتان خارج نمی‌شود.",
      s3: "<b>ذخیره‌ی رمزنگاری‌شده.</b> کلید شما رمزنگاری‌شده نگه‌داری می‌شود و هر لحظه می‌توانید آن را قطع کنید.",
      s4: "<b>معاملات محافظت‌شده.</b> با پایان اشتراک، معاملات باز محافظت می‌شوند و بعد از بسته‌شدن همه، کلید پاک می‌شود.",
      s5: "<b>تأیید سمت سرور.</b> دسترسی بر اساس اشتراک شما در سرور بررسی می‌شود — این صفحه به‌تنهایی دسترسی نمی‌دهد.",
      f1q: "هزینه‌ی جداگانه دارد؟", f1a: "خیر. ترید خودکار جزو اشتراک فعال شماست و دقیقاً تا زمانی که اشتراک دارید روشن است.",
      f2q: "می‌توانم هر دو صرافی را داشته باشم؟", f2a: "خیر. هر عضو فقط روی یک صرافی فعال می‌شود. همان صرافی‌ای را که واقعاً در آن معامله می‌کنید انتخاب کنید.",
      f3q: "بعداً می‌توانم صرافی را عوض کنم؟", f3a: "فقط ادمین می‌تواند شما را به صرافی دیگر منتقل کند. از بخش پشتیبانی به ادمین پیام بدهید.",
      f4q: "با پایان اشتراک چه می‌شود؟", f4a: "معامله‌ی جدید باز نمی‌شود. معاملات بازِ قبلی با حد ضرر و تارگت تا پایان مدیریت می‌شوند. با تمدید اشتراک همه‌چیز ادامه پیدا می‌کند.",
      f5q: "کلید API چه دسترسی‌هایی لازم دارد؟", f5a: "فقط Read و Trade. هرگز Withdraw را فعال نکنید — کلیدی که اجازه‌ی برداشت دارد نباید استفاده شود.",
      f6q: "سود تضمینی است؟", f6a: "خیر. معامله ریسک دارد و ضرر ممکن است رخ دهد. سیستم قوانین ریسک سخت‌گیرانه دارد ولی نتیجه تضمین نمی‌شود — فقط با پولی که توان ریسکش را دارید معامله کنید.",
      assigned: "🔒 اختصاص‌یافته به شما", kEx: "صرافی", kFee: "هزینه", feeV: "شامل اشتراک", kSub: "اشتراک", kBot: "ربات", kStat: "وضعیت", statV: "اختصاص داده شد",
      lockNote: "حساب شما فقط روی <b>{x}</b> کار می‌کند. برای تغییر صرافی از بخش <b>پشتیبانی</b> به ادمین پیام بدهید.", openBot: "باز کردن ربات {x}",
      closedT: "موقتاً در دسترس نیست", closedB: "فعال‌سازی جدید فعلاً بسته است.", closedS: "کمی بعد دوباره سر بزنید — اشتراک شما تغییری نمی‌کند.",
      risk: "معامله ریسک دارد. نتایج گذشته سود آینده را تضمین نمی‌کند."
    }
  };
  var me = safeName(q.get("me"));
  var chosen = BOTS[q.get("ex")] ? q.get("ex") : "";
  var open = q.get("open") !== "0";
  var days = Math.max(0, Math.min(3650, parseInt(q.get("d") || "0", 10) || 0));
  var selected = "";
  var lang = "en";
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), bar = $("bar"), cta = $("cta"), hint = $("hint");

  (function pickLang() {
    var saved = ""; try { saved = localStorage.getItem("at_lang") || ""; } catch (e) {}
    var tgl = "";
    try { tgl = ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || "").toLowerCase(); } catch (e) {}
    lang = chosen === "nobitex" ? "fa" : (q.get("lg") === "fa" ? "fa" : (saved === "fa" || saved === "en" ? saved : (tgl.indexOf("fa") === 0 ? "fa" : "en")));
  })();

  if (tg) {
    try {
      tg.ready(); tg.expand();
      tg.disableVerticalSwipes && tg.disableVerticalSwipes();
      tg.setHeaderColor && tg.setHeaderColor("#07070a");
      tg.setBackgroundColor && tg.setBackgroundColor("#07070a");
      tg.setBottomBarColor && tg.setBottomBarColor("#07070a");
    } catch (e) {}
  }
  function tap(kind) { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind || "light"); } catch (e) {} }
  function link(url) { if (tg && tg.openTelegramLink) { tg.openTelegramLink(url); } else { window.open(url, "_blank", "noopener"); } }
  function X() { return T[lang]; }
  function num(n) { return lang === "fa" ? String(n).replace(/\d/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[d]; }) : String(n); }

  function hero(lead, pills) {
    var x = X();
    var sw = chosen === "nobitex" ? "" : '<button id="lang" class="langbtn" type="button">' + x.sw + '</button>';
    return '<div class="top">' + sw + '</div><div class="hero fade"><img class="logo" alt="TC · Trade is cool" src="' + LOGO + '" width="116" height="116">' +
      '<h1>' + x.title + '</h1><p class="tag">' + x.tag + '</p><p class="lead">' + lead + '</p><div class="pills">' + pills + '</div></div>';
  }
  function pillsHtml() {
    var x = X();
    var dl = days > 0 ? ' · ' + num(days) + ' ' + (days === 1 ? x.dayOne : x.dayMany) + ' ' + x.left : "";
    return '<span class="pill ok">✅ ' + x.active + dl + '</span><span class="pill">🎁 ' + x.incl + '</span>';
  }
  function bindLang() {
    var b = $("lang");
    if (b) b.onclick = function () { lang = lang === "fa" ? "en" : "fa"; try { localStorage.setItem("at_lang", lang); } catch (e) {} tap(); render(); window.scrollTo(0, 0); };
  }
  function faq() {
    var x = X(), out = "";
    for (var i = 1; i <= 6; i++) out += "<details><summary>" + x["f" + i + "q"] + "</summary><p>" + x["f" + i + "a"] + "</p></details>";
    return out;
  }
  function security() {
    var x = X();
    return '<div class="panel"><ul class="sec"><li><span>🔑</span><span>' + x.s1 + '</span></li><li><span>🏦</span><span>' + x.s2 + '</span></li><li><span>🔐</span><span>' + x.s3 +
      '</span></li><li><span>🛡</span><span>' + x.s4 + '</span></li><li><span>✔️</span><span>' + x.s5 + '</span></li></ul></div>';
  }
  function steps() {
    var x = X();
    return '<div class="panel"><ol class="steps">' + [1, 2, 3, 4].map(function (i) {
      return '<li data-n="' + num(i) + '"><div><b>' + x["h" + i] + '</b><small>' + x["h" + i + "d"] + '</small></div></li>';
    }).join("") + '</ol></div>';
  }
  function benefits() {
    var x = X();
    var it = [["⚡", "b1"], ["🛡", "b2"], ["🎛", "b3"], ["🎁", "b4"]];
    return '<div class="grid2">' + it.map(function (a) {
      return '<div class="ben"><div class="i">' + a[0] + '</div><b>' + x[a[1] + "t"] + '</b><span>' + x[a[1] + "d"] + '</span></div>';
    }).join("") + '</div>';
  }
  function foot() { var x = X(); return '<div class="foot"><b>' + x.tag + '</b>' + x.risk + '</div>'; }

  function renderChoose() {
    var x = X();
    var cards = ["nobitex", "toobit"].map(function (k) {
      var c = CODE[k];
      return '<button class="ex" type="button" role="radio" aria-checked="false" data-ex="' + k + '">' +
        '<div class="mono ' + c + '">' + LET[k] + '</div><div><div class="name">' + x[c] + '</div><div class="aud">' + x[c + "Aud"] + '</div><div class="desc">' + x[c + "Desc"] + '</div>' +
        '<div class="meta"><span class="chip">' + x[c + "C1"] + '</span><span class="chip">' + x[c + "C2"] + '</span></div></div><div class="radio"></div></button>';
    }).join("");
    app.innerHTML = hero(x.leadChoose, pillsHtml()) +
      '<h2>' + x.hWhy + '</h2>' + benefits() +
      '<h2>' + x.hHow + '</h2>' + steps() +
      '<h2>' + x.hPick + '</h2><div class="cards" role="radiogroup">' + cards + '</div>' +
      '<div class="notice"><span class="ico">⚠️</span><div>' + x.warn + '</div></div>' +
      '<h2>' + x.hConfirm + '</h2><div class="panel"><label class="check"><input type="checkbox" id="ack"><span>' + x.ack + '</span></label></div>' +
      '<h2>' + x.hSec + '</h2>' + security() +
      '<h2>' + x.hFaq + '</h2>' + faq() + foot();
    bar.classList.remove("hidden");
    var cards_ = app.querySelectorAll(".ex"), ack = $("ack");
    function sync() {
      cards_.forEach(function (c) { c.setAttribute("aria-checked", c.dataset.ex === selected ? "true" : "false"); });
      cta.disabled = !(selected && ack.checked);
      cta.textContent = selected ? x.cont + x[CODE[selected]] : x.pick;
      hint.textContent = !selected ? x.hintPick : (!ack.checked ? x.hintAck : x.fine);
    }
    cards_.forEach(function (c) { c.addEventListener("click", function () { selected = c.dataset.ex; tap(); sync(); }); });
    ack.addEventListener("change", function () { tap(); sync(); });
    cta.onclick = function () {
      if (cta.disabled) return;
      if (!me) { hint.textContent = x.fromMenu; return; }
      tap("medium");
      link("https://t.me/" + me + "?start=atsel_" + CODE[selected]);
      if (tg && tg.close) { setTimeout(function () { tg.close(); }, 250); }
    };
    sync(); bindLang();
  }

  function renderLocked() {
    var x = X(), c = CODE[chosen], name = x[c], bot = BOTS[chosen];
    var dl = days > 0 ? '<div class="kv"><span>' + x.kSub + '</span><span>' + num(days) + ' ' + (days === 1 ? x.dayOne : x.dayMany) + ' ' + x.left + '</span></div>' : '';
    app.innerHTML = hero(x.leadLocked, pillsHtml()) +
      '<div class="panel locked fade"><div class="mono ' + c + '">' + LET[chosen] + '</div><span class="badge">' + x.assigned + '</span><h3>' + name + '</h3><div class="sub">' + x[c + "Aud"] + '</div>' +
      '<div style="margin-top:12px;text-align:start"><div class="kv"><span>' + x.kEx + '</span><span>' + name + '</span></div>' +
      '<div class="kv"><span>' + x.kBot + '</span><span dir="ltr">@' + bot + '</span></div>' +
      '<div class="kv"><span>' + x.kFee + '</span><span>' + x.feeV + '</span></div>' + dl +
      '<div class="kv"><span>' + x.kStat + '</span><span>' + x.statV + '</span></div></div></div>' +
      '<div class="notice"><span class="ico">🔒</span><div>' + x.lockNote.replace("{x}", name) + '</div></div>' +
      '<h2>' + x.hHow + '</h2>' + steps() +
      '<h2>' + x.hSec + '</h2>' + security() +
      '<h2>' + x.hFaq + '</h2>' + faq() + foot();
    bar.classList.remove("hidden");
    cta.disabled = false; cta.textContent = x.openBot.replace("{x}", name); hint.textContent = "\u2066@" + bot + "\u2069";
    cta.onclick = function () { tap("medium"); link("https://t.me/" + bot); };
    bindLang();
  }

  function renderClosed() {
    var x = X();
    app.innerHTML = hero(x.closedT, "") + '<div class="panel fade"><b>' + x.closedB + '</b><div style="color:var(--muted);margin-top:6px;font-size:13.5px">' + x.closedS + '</div></div>' + foot();
    bar.classList.add("hidden");
    bindLang();
  }

  function render() {
    document.documentElement.lang = lang; document.documentElement.dir = X().dir;
    if (chosen) renderLocked(); else if (!open) renderClosed(); else renderChoose();
  }
  render();
})();
</script>
</body>
</html>
