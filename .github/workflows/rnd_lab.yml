# 🧪 R&D Lab — چرخه‌ی «پژوهش سنگین»: ایده‌پردازی (هوش مصنوعی + جست‌وجوی هدایت‌شده + جهش برترین‌های قبلی) → پیش‌غربال روی ۶۰٪ اول داده
# → آزمایشگاه کامل (strategy_lab: همه‌ی تایم‌فریم‌ها/نمادها/نردبان‌ها، train/test، t-stat، کارمزد) → verdict + نتایج برای پنل.
# هیچ‌چیز مستقیم روی ربات‌ها اعمال نمی‌شود؛ فقط data/rnd_strategies.json, rnd_verdicts.json, rnd_results.json کامیت می‌شوند.
# اجرا: خودکار هر ساعت «فقط چک» (پژوهش سنگین حداکثر هر ۲ ساعت = ۲۴ ساعته) (اگر موعد پژوهش نرسیده باشد در ~۲۰ ثانیه تمام می‌شود)، یا دکمه‌ی «🔬 Deep research now» در پنل ادمین.
# Secret اختیاری: ANTHROPIC_API_KEY (بدون آن، فقط جست‌وجوی خودکار کار می‌کند). TWELVEDATA_API_KEY مثل بقیه‌ی آزمایشگاه‌ها.
name: R&D Lab research
concurrency:
  group: rnd-lab
  cancel-in-progress: false
on:
  schedule:
    - cron: "23 * * * *"        # 🔁 هر ساعت (R&D بیست‌وچهارساعته؛ اگر موعد نرسیده باشد plan در ~۲۰ ثانیه تمام می‌شود)
  workflow_dispatch:
    inputs:
      force:
        description: "Run the full research now (ignore the schedule)"
        default: "true"
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY || secrets.ANTHROPIC_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY || secrets.GROK_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      GROK_MODEL: ${{ vars.GROK_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
    outputs:
      go: ${{ steps.p.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}      # 🔴 همیشه آخرین نوکِ شاخه (نه SHA ساعت‌ها قبلِ شروع) - مثل ورک‌فلوهای اصلی
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - id: p
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            python rnd_research.py plan --force
          else
            python rnd_research.py plan
          fi
  prepare:
    needs: [plan]
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY || secrets.ANTHROPIC_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY || secrets.GROK_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      GROK_MODEL: ${{ vars.GROK_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}      # 🔴 همیشه آخرین نوکِ شاخه (نه SHA ساعت‌ها قبلِ شروع) - مثل ورک‌فلوهای اصلی
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Ideas + train-only prescreen + slot assignment
        run: python -u rnd_research.py prepare --days15 700 2>&1 | tee prepare_log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rnd-slots
          path: |
            data/rnd_strategies.json
            data/rnd_prepare.json
            data/rnd_library.json
            prepare_log.txt
  lab:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4        # سهمیه‌ی همزمانی را برای ربات‌ها و آزمایشگاه‌های دیگر آزاد نگه می‌دارد
      matrix:
        group:
          - { id: s1, symbols: "BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT ADAUSDT LINKUSDT AVAXUSDT" }
          - { id: s2, symbols: "LTCUSDT DOTUSDT ATOMUSDT NEARUSDT UNIUSDT BCHUSDT ETCUSDT TRXUSDT" }
          - { id: s3, symbols: "XLMUSDT FILUSDT AAVEUSDT ALGOUSDT ARBUSDT OPUSDT INJUSDT SUIUSDT" }
        tf:
          - { id: 5m, d5: 365, d15: 200 }
          - { id: 15m, d5: 0, d15: 700 }
          - { id: 1h, d5: 0, d15: 1500 }
          - { id: 4h, d5: 0, d15: 1500 }
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: rnd-slots, path: slots_in }
      - run: mkdir -p data && cp slots_in/data/rnd_strategies.json data/rnd_strategies.json
      - name: Lab ${{ matrix.tf.id }} / ${{ matrix.group.id }}
        run: python -u strategy_lab.py --fetch ${{ matrix.group.symbols }} --tf ${{ matrix.tf.id }} --days1 0 --days5 ${{ matrix.tf.d5 }} --days15 ${{ matrix.tf.d15 }} --days1h ${{ matrix.tf.d15 }} --days4h ${{ matrix.tf.d15 }} --design --gens RD1 RD2 RD3 RD4 RD5 RD6 --dump part_${{ matrix.tf.id }}_${{ matrix.group.id }}.pkl 2>&1 | tee log_${{ matrix.tf.id }}_${{ matrix.group.id }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpart-${{ matrix.tf.id }}-${{ matrix.group.id }}
          if-no-files-found: warn
          path: |
            part_*.pkl
            log_*.txt
  finalize:
    needs: [prepare, lab]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}      # 🔴 همیشه آخرین نوکِ شاخه (نه SHA ساعت‌ها قبلِ شروع) - مثل ورک‌فلوهای اصلی
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: rnd-slots, path: slots_in }
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: rpart-*, merge-multiple: false }
      - name: Merge, verdicts, results
        run: |
          mkdir -p data
          cp slots_in/data/rnd_strategies.json data/rnd_strategies.json
          cp slots_in/data/rnd_prepare.json data/rnd_prepare.json
          cp slots_in/data/rnd_library.json data/rnd_library.json 2>/dev/null || true      # 📚 کتابخانه‌ی غربالِ این چرخه (از prepare)
          export $(python rnd_research.py gate-env)      # 🎯 حد PF/وین‌ریت آزمایشگاه = تنظیمات پنل ادمین (Pass criteria)
          python -u strategy_lab.py --design --merge $(find parts -name 'part_*.pkl' | sort) --fee 0.10 --verdicts rnd_raw_verdicts.json 2>&1 | tee rnd_lab_report.txt
          python -u rnd_research.py finalize --raw rnd_raw_verdicts.json
          rm -f data/rnd_prepare.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rnd-report
          path: |
            rnd_lab_report.txt
            data/rnd_results.json
      - name: Publish results (strategies + verdicts + results together, always on the freshest branch tip)
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # 🔴 رفعِ ریشه‌ای «could not push R&D results»: این اجرا ساعت‌ها طول می‌کشد و در این مدت ربات‌ها/پنل ادمین چندصد بار به همین شاخه
          # push کرده‌اند؛ `git pull --rebase` روی کامیتِ کهنه با فایل‌های مشترکِ data/ تعارض می‌گرفت و بعد از ۵ تلاش شکست می‌خورد
          # (و چون نتیجه ثبت نمی‌شد، `plan` ساعت بعد دوباره یک چرخه‌ی ۷ساعته شروع می‌کرد). راه‌حل: به‌جای rebase، شاخه را روی «آخرین نسخه‌ی ریموت»
          # می‌بریم و جمع‌بندیِ ارزان (finalize، چند ثانیه) را دوباره روی همان وضعیتِ تازه اجرا می‌کنیم؛ پس تعارضی ممکن نیست و فقط اگر
          # همزمان کسی push کرده باشد (non-fast-forward) با تأخیر تصادفی دوباره تلاش می‌شود.
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8; do
            if ! git fetch --quiet origin "$BRANCH"; then sleep $((i * 5)); continue; fi
            git reset --hard "origin/$BRANCH"
            mkdir -p data
            cp slots_in/data/rnd_strategies.json data/rnd_strategies.json
            cp slots_in/data/rnd_prepare.json data/rnd_prepare.json
            cp slots_in/data/rnd_library.json data/rnd_library.json 2>/dev/null || true
            python rnd_research.py finalize --raw rnd_raw_verdicts.json || { echo "::error::R&D finalize failed"; exit 1; }
            rm -f data/rnd_prepare.json
            git add data/rnd_strategies.json data/rnd_verdicts.json data/rnd_results.json data/rnd_library.json
            if git diff --cached --quiet; then echo "no changes to publish"; exit 0; fi
            git commit -q -m "R&D lab cycle [skip ci]"
            if git push origin "HEAD:$BRANCH"; then echo "published (attempt $i)"; exit 0; fi
            sleep $((RANDOM % 8 + i * 4))
          done
          echo "::error::could not push R&D results"; exit 1
