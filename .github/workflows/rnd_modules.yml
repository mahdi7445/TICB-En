# 🧩 R&D — بازآزمایی «همه‌ی ماژول‌های قدیمی» به‌صورت ۲۴ ساعته.
# هر ساعت بیدار می‌شود؛ `plan` طبق تنظیمات پنل (R&D ← Settings ← «Re-test ALL old modules») تصمیم می‌گیرد اجرا شود یا نه
# (۲۴ ساعته = حداقل ۱ ساعت پس از پایان اجرای قبلی). بک‌تست همه‌ی ماژول‌ها روی همه‌ی تایم‌فریم‌ها با «همه‌ی نردبان‌ها» (--design)،
# سپس «🎯 Pass criteria»ی ادمین روی بهترین نردبانِ هر ماژول اعمال می‌شود (rnd_research.py modules-finalize).
# خروجی: data/rnd_modules.json (گزارش) و، در حالت Auto، data/lowtf_verdicts.json (بهترین نردبان / قفل ماژول رد‌شده).
# ماژول‌های بازنشسته (MTS MTC VCR RSM TKS DKS TKM LSM VCB BZ1M BZ5M BZ15) پیش‌فرض بیرون‌اند؛ با Repository variable به نام RND_MODULE_GENS می‌توان فهرست را تغییر داد.
name: R&D modules (24h re-test)
concurrency:
  group: rnd-modules
  cancel-in-progress: false
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now regardless of schedule"
        default: "false"
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.p.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - id: p
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            python rnd_research.py modules-plan --force
          else
            python rnd_research.py modules-plan
          fi
  part:
    needs: [plan]
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 5      # سهمیه‌ی ۲۰ جاب: بقیه برای ربات‌ها و rnd_lab آزاد بماند
      matrix:
        group:
          - { id: s1, symbols: "BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT ADAUSDT" }
          - { id: s2, symbols: "LINKUSDT AVAXUSDT LTCUSDT DOTUSDT ATOMUSDT NEARUSDT" }
          - { id: s3, symbols: "UNIUSDT BCHUSDT ETCUSDT TRXUSDT XLMUSDT FILUSDT" }
          - { id: s4, symbols: "AAVEUSDT ALGOUSDT SANDUSDT ICPUSDT ARBUSDT OPUSDT" }
          - { id: s5, symbols: "INJUSDT SUIUSDT HBARUSDT BATUSDT" }
        tf:
          - { id: 1m, d1: 90, d5: 0, d15: 200 }
          - { id: 5m, d1: 0, d5: 730, d15: 200 }
          - { id: 15m, d1: 0, d5: 0, d15: 2000 }
          - { id: 1h, d1: 0, d5: 0, d15: 2000 }
          - { id: 4h, d1: 0, d5: 0, d15: 2000 }
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      MODULE_GENS: ${{ vars.RND_MODULE_GENS || 'CNDL RFD SWR TKF SMM SMS TPB TPS FBR MRA MRB BZ1H BZ4H' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Back-test ${{ matrix.tf.id }} / ${{ matrix.group.id }}
        run: python -u strategy_lab.py --fetch ${{ matrix.group.symbols }} --tf ${{ matrix.tf.id }} --days1 ${{ matrix.tf.d1 }} --days5 ${{ matrix.tf.d5 }} --days15 ${{ matrix.tf.d15 }} --days1h ${{ matrix.tf.d15 }} --days4h ${{ matrix.tf.d15 }} --design --gens $MODULE_GENS --dump part_${{ matrix.tf.id }}_${{ matrix.group.id }}.pkl 2>&1 | tee log_${{ matrix.tf.id }}_${{ matrix.group.id }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpart-${{ matrix.tf.id }}-${{ matrix.group.id }}
          if-no-files-found: warn
          path: |
            part_*.pkl
            log_*.txt
  finalize:
    needs: [plan, part]
    if: always() && needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: mpart-* }
      - name: Verdicts + admin criteria
        run: |
          mkdir -p data
          export $(python rnd_research.py gate-env)      # 🎯 حد PF/وین‌ریت آزمایشگاه = تنظیمات پنل ادمین
          python -u strategy_lab.py --design --merge $(find parts -name 'part_*.pkl' | sort) --fee 0.10 --verdicts modules_raw.json 2>&1 | tee modules_report.txt
          python rnd_research.py modules-finalize --raw modules_raw.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rnd-modules-report
          path: |
            modules_report.txt
            modules_raw.json
            data/rnd_modules.json
      - name: Commit results
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add data/rnd_modules.json data/lowtf_verdicts.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "R&D modules re-test [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*5))
          done
          exit 1
