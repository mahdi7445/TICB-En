# LONG-HISTORY check of the three 4h variants that were CONFIRMED on unseen symbols (HDV3, DON, SWP-in-range).
# Goal: test them on EARLIER years (different market regimes: 2020-21 bull, 2022 bear) = the time dimension the first two runs did not cover.
# Output: artifact "long-report". Only 4h, only 4 families -> light run.
name: Strategy lab long 4h
on:
  workflow_dispatch:
    inputs:
      fee:
        description: "Round-trip fee+slippage in % of price"
        default: "0.10"
      days:
        description: "Days of history to request (the data source may serve less; the loader retries shorter windows)"
        default: "2600"
jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        group:
          - { id: l1, symbols: "BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT ADAUSDT" }
          - { id: l2, symbols: "LINKUSDT AVAXUSDT LTCUSDT DOTUSDT ATOMUSDT NEARUSDT" }
          - { id: l3, symbols: "UNIUSDT BCHUSDT ETCUSDT TRXUSDT XLMUSDT FILUSDT" }
          - { id: l4, symbols: "AAVEUSDT ALGOUSDT SANDUSDT ICPUSDT ARBUSDT OPUSDT" }
          - { id: l5, symbols: "INJUSDT SUIUSDT HBARUSDT BATUSDT" }
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Back-test 4h / ${{ matrix.group.id }}
        run: python -u strategy_lab.py --fetch ${{ matrix.group.symbols }} --tf 4h --days1 0 --days5 0 --days15 ${{ github.event.inputs.days }} --days1h ${{ github.event.inputs.days }} --days4h ${{ github.event.inputs.days }} --gens HDV3 DON SWP ENG --dump part_4h_${{ matrix.group.id }}.pkl 2>&1 | tee log_4h_${{ matrix.group.id }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lpart-${{ matrix.group.id }}
          if-no-files-found: warn
          path: |
            part_*.pkl
            log_*.txt
  merge:
    needs: [part]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - name: Long-history report
        run: |
          python -u strategy_lab.py --merge $(find parts -name 'part_*.pkl' | sort) --fee ${{ github.event.inputs.fee }} --show "HDV3|none|nat|B2" "HDV3|none|A3|B2" "HDV3|none|nat|LAD" "HDV3|none|A3|LAD" "DON|none|A3|B2" "DON|none|A3|LAD" "SWP|gR|A3|LAD" "SWP|gR|A3|B2" "ENG|M|A3|LAD" 2>&1 | tee long_report.txt
          for f in $(find parts -name 'log_*.txt' | sort); do echo "=== $f" >> data_logs.txt; grep -E "warn|failed|skipped|candles from" $f >> data_logs.txt || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-report
          if-no-files-found: warn
          path: |
            long_report.txt
            data_logs.txt
