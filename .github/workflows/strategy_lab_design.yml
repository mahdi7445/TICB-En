# DESIGN round: for the strategies that passed (4h hidden divergence, 4h sweep in range) and the 1h two-leg family, find the best
#   (a) STOP placement (swing / halfway / under the inside bar)  and  (b) TARGET management (brackets 2R/2.5R/3R/4R, the live ladder, 4 custom ladders).
# Every row shows win%, profit factor, net R, t, per-year R and the cost sensitivity. 28 symbols, ~5.7 years. Output: artifact "design-report".
name: Strategy lab design
on:
  workflow_dispatch:
    inputs:
      fee:
        description: "Round-trip fee+slippage in % of price"
        default: "0.10"
jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        group:
          - { id: d1, symbols: "BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT ADAUSDT" }
          - { id: d2, symbols: "LINKUSDT AVAXUSDT LTCUSDT DOTUSDT ATOMUSDT NEARUSDT" }
          - { id: d3, symbols: "UNIUSDT BCHUSDT ETCUSDT TRXUSDT XLMUSDT FILUSDT" }
          - { id: d4, symbols: "AAVEUSDT ALGOUSDT SANDUSDT ICPUSDT ARBUSDT OPUSDT" }
          - { id: d5, symbols: "INJUSDT SUIUSDT HBARUSDT BATUSDT" }
        tf: [ "4h", "1h" ]
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Design run ${{ matrix.tf }} / ${{ matrix.group.id }}
        run: |
          if [ "${{ matrix.tf }}" = "4h" ]; then G="HDV3 HDV3i HDV3m SWP"; else G="TS1 TS3 TL2L HDV6"; fi
          python -u strategy_lab.py --fetch ${{ matrix.group.symbols }} --tf ${{ matrix.tf }} --days1 0 --days5 0 --days15 2000 --days1h 2000 --days4h 2000 --design --gens $G --dump part_${{ matrix.tf }}_${{ matrix.group.id }}.pkl 2>&1 | tee log_${{ matrix.tf }}_${{ matrix.group.id }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dpart-${{ matrix.tf }}-${{ matrix.group.id }}
          if-no-files-found: warn
          path: |
            part_*.pkl
            log_*.txt
  merge:
    needs: [part]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - name: Design report
        run: |
          python -u strategy_lab.py --merge $(find parts -name 'part_*.pkl' | sort) --fee ${{ github.event.inputs.fee }} --show "HDV3*|none|*|*" "SWP|gR|*|*" "SWP|none|*|*" "TS1|none|*|*" "TS3|none|*|*" "TL2L|none|*|*" "HDV6|none|*|*" 2>&1 | tee design_report.txt
          for f in $(find parts -name 'log_*.txt' | sort); do echo "=== $f" >> data_logs.txt; grep -E "warn|failed|skipped|candles from" $f >> data_logs.txt || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-report
          if-no-files-found: warn
          path: |
            design_report.txt
            data_logs.txt
