# CONFIRMATION run: re-tests ONLY the variants frozen from the first big lab report, on 15 symbols the first run never saw.
# No searching happens here, so the result is not inflated by picking the best of ~1000 variants. Output: artifact "confirm-report".
name: Strategy lab confirm
on:
  workflow_dispatch:
    inputs:
      fee:
        description: "Round-trip fee+slippage in % of price"
        default: "0.10"
jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        group:
          - { id: c1, symbols: "TRXUSDT XLMUSDT FILUSDT AAVEUSDT ALGOUSDT" }
          - { id: c2, symbols: "SANDUSDT ICPUSDT ARBUSDT OPUSDT INJUSDT" }
          - { id: c3, symbols: "SUIUSDT HBARUSDT BATUSDT ZECUSDT EOSUSDT" }
        tf:
          - { id: 5m, d5: 240, d15: 120 }
          - { id: 15m, d5: 0, d15: 1200 }
          - { id: 1h, d5: 0, d15: 1200 }
          - { id: 4h, d5: 0, d15: 1200 }
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Back-test ${{ matrix.tf.id }} / ${{ matrix.group.id }}
        run: python -u strategy_lab.py --fetch ${{ matrix.group.symbols }} --tf ${{ matrix.tf.id }} --days1 0 --days5 ${{ matrix.tf.d5 }} --days15 ${{ matrix.tf.d15 }} --days1h ${{ matrix.tf.d15 }} --days4h ${{ matrix.tf.d15 }} --gens HDV3 TL2L TS1 TS2 TS3 DON MCD VB2d SWP SUP ENG --dump part_${{ matrix.tf.id }}_${{ matrix.group.id }}.pkl 2>&1 | tee log_${{ matrix.tf.id }}_${{ matrix.group.id }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpart-${{ matrix.tf.id }}-${{ matrix.group.id }}
          if-no-files-found: warn
          path: |
            part_*.pkl
            log_*.txt
  merge:
    needs: [part]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - name: Confirmation report
        run: |
          python -u strategy_lab.py --merge $(find parts -name 'part_*.pkl' | sort) --fee ${{ github.event.inputs.fee }} --show "HDV3|none|nat|B2" "HDV3|none|A3|B2" "TL2L|none|nat|B2" "TL2L|none|nat|BT" "TS1|none|nat|B2" "TS1|none|nat|BT" "TS2|none|nat|B2" "TS3|M|A3|B2" "DON|none|A3|B2" "DON|gD|A3|B2" "MCD|DS|A3|LAD" "VB2d|D4|A3|BT" "SWP|gR|A3|LAD" "SUP|V|nat|LAD" "ENG|M|A3|LAD" 2>&1 | tee confirm_report.txt
          for f in $(find parts -name 'log_*.txt' | sort); do echo "=== $f" >> data_logs.txt; grep -E "warn|failed|skipped|candles from" $f >> data_logs.txt || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confirm-report
          if-no-files-found: warn
          path: |
            confirm_report.txt
            data_logs.txt
