# Manual workflow: back-tests ALL candidate strategies (current candle signal, VWAP session strategies, two-leg V pattern,
# volume profile, sessions/ORB, Dow structure, liquidity sweeps, research candidates) on real exchange candles for 1m / 5m / 15m / 1h and prints one report.
# Run: Actions -> "Strategy lab" -> Run workflow. The report is in the job log and in the artifact "strategy-lab-report".
name: Strategy lab
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbols (space separated, exchange style)"
        default: "BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT ADAUSDT LINKUSDT AVAXUSDT LTCUSDT DOTUSDT"
      fee:
        description: "Round-trip fee+slippage in % of price (0.10 = 0.05% per side)"
        default: "0.10"
      days1:
        description: "Days of 1m candles"
        default: "30"
      days5:
        description: "Days of 5m candles"
        default: "120"
      days15:
        description: "Days of 15m candles"
        default: "300"
      days1h:
        description: "Days of 1h candles (built from 15m)"
        default: "500"
      days4h:
        description: "Days of 4h candles (built from 15m)"
        default: "700"
      gens:
        description: "Optional: only these strategy families (space separated, e.g. 'TL2 TL2B TL2N TL2L SMCc SMCb SMCa FVG EQL'). Empty = all. Use it to split a long run over several jobs."
        default: ""
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}   # optional fallback data source (same secret the bot uses)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Selftest (ladder == live engine, no lookahead, zero-edge world, planted patterns)
        continue-on-error: true            # a selftest failure must not hide the real back-test; its log is uploaded below
        run: python strategy_lab.py --selftest 2>&1 | tee selftest.log
      - name: Back-test all strategies
        run: python strategy_lab.py --fetch ${{ github.event.inputs.symbols }} --fee ${{ github.event.inputs.fee }} --days1 ${{ github.event.inputs.days1 }} --days5 ${{ github.event.inputs.days5 }} --days15 ${{ github.event.inputs.days15 }} --days1h ${{ github.event.inputs.days1h }} --days4h ${{ github.event.inputs.days4h }} --gens ${{ github.event.inputs.gens }} --selection lab_selection.json 2>&1 | tee report_strategy_lab.txt
      - uses: actions/upload-artifact@v4
        if: always()                       # keep the logs even when a step failed
        with:
          name: strategy-lab-report
          if-no-files-found: warn
          path: |
            report_strategy_lab.txt
            lab_selection.json
            selftest.log
