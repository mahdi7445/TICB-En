# Parallel strategy lab: one job per (timeframe x symbol group), then one job merges everything into a single report.
# Why: a single sequential job for 15 symbols x 1200 days needs > 6 h and GitHub kills it (no report). Here every job needs well under 6 h.
# Run: Actions -> "Strategy lab" -> Run workflow. Result: artifact "strategy-lab-report" (report_strategy_lab.txt, lab_selection.json, selftest.log).
name: Strategy lab
on:
  workflow_dispatch:
    inputs:
      fee:
        description: "Round-trip fee+slippage in % of price (0.10 = 0.05% per side)"
        default: "0.10"
      gens:
        description: "Optional: only these strategy families (space separated, e.g. 'HDV HDV3 TS1 TS2 TS3 TL2'). Empty = all."
        default: ""
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Selftest (ladder == live engine, no lookahead, zero-edge world, planted patterns)
        continue-on-error: true
        run: python -u strategy_lab.py --selftest 2>&1 | tee selftest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lab-selftest, path: selftest.log, if-no-files-found: warn }
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        group:
          - { id: g1, symbols: "BTCUSDT ETHUSDT SOLUSDT" }
          - { id: g2, symbols: "XRPUSDT DOGEUSDT ADAUSDT" }
          - { id: g3, symbols: "LINKUSDT AVAXUSDT LTCUSDT" }
          - { id: g4, symbols: "DOTUSDT ATOMUSDT NEARUSDT" }
          - { id: g5, symbols: "UNIUSDT BCHUSDT ETCUSDT" }
        tf:
          - { id: 1m, d1: 60, d5: 0, d15: 120, d1h: 120, d4h: 120 }
          - { id: 5m, d1: 0, d5: 240, d15: 120, d1h: 120, d4h: 120 }
          - { id: 15m, d1: 0, d5: 0, d15: 1200, d1h: 1200, d4h: 1200 }
          - { id: 1h, d1: 0, d5: 0, d15: 1200, d1h: 1200, d4h: 1200 }
          - { id: 4h, d1: 0, d5: 0, d15: 1200, d1h: 1200, d4h: 1200 }
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Back-test ${{ matrix.tf.id }} / ${{ matrix.group.id }}
        run: python -u strategy_lab.py --fetch ${{ matrix.group.symbols }} --tf ${{ matrix.tf.id }} --days1 ${{ matrix.tf.d1 }} --days5 ${{ matrix.tf.d5 }} --days15 ${{ matrix.tf.d15 }} --days1h ${{ matrix.tf.d1h }} --days4h ${{ matrix.tf.d4h }} --gens ${{ github.event.inputs.gens }} --dump part_${{ matrix.tf.id }}_${{ matrix.group.id }}.pkl 2>&1 | tee log_${{ matrix.tf.id }}_${{ matrix.group.id }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-${{ matrix.tf.id }}-${{ matrix.group.id }}
          if-no-files-found: warn
          path: |
            part_*.pkl
            log_*.txt
  merge:
    needs: [part, selftest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - name: Merge all parts into one report
        run: |
          ls -R parts | head -80
          python -u strategy_lab.py --merge $(find parts -name 'part_*.pkl' | sort) --fee ${{ github.event.inputs.fee }} --selection lab_selection.json 2>&1 | tee report_strategy_lab.txt
          cat parts/lab-selftest/selftest.log >> report_strategy_lab.txt || true
          for f in $(find parts -name 'log_*.txt' | sort); do echo "=== $f" >> data_logs.txt; grep -E "warn|failed|skipped" $f >> data_logs.txt || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-lab-report
          if-no-files-found: warn
          path: |
            report_strategy_lab.txt
            lab_selection.json
            data_logs.txt
