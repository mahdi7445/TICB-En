name: Candle Signal Engine

# ⚠️ این ورک‌فلو پیوسته تا حدود ۵ ساعت و ۲۰ دقیقه اجرا می‌ماند: یک اتصال WebSocket زنده به
# Coinbase برای بیت‌کوین/اتریوم نگه می‌دارد (دقت چند ثانیه‌ای، بدون هیچ هزینه‌ی API) و هر
# ۵ دقیقه یک دور اسکن کامل (سیگنال جدید + رهگیری REST طلا) هم انجام می‌دهد.
#
# فاصله‌ی کرون (۵ ساعت) از مدت هر اجرا (۵ ساعت و ۲۰ دقیقه) کوتاه‌تره تا هیچ‌وقت شکاف/خاموشی
# نداشته باشیم - وقتی اجرای بعدی باید شروع بشه، اجرای قبلی هنوز فعاله و در صف قرار می‌گیره.
#
# ⚠️ ADMIN_USER_IDS (همون سکرتی که subscription_bot.yml هم استفاده می‌کنه) رو اینجا هم اضافه
# کردیم: اگه یک استثنای غیرمنتظره توی حلقه‌ی اصلی رخ بده، جدا از لاگ Actions، مستقیم به
# ادمین(ها) هم پیام تلگرام می‌فرسته - چون لاگ Actions معمولاً کسی رصد نمی‌کنه.

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
    inputs:
      force_run_all:
        description: "اجرای فوری صرف‌نظر از ساعت (برای تست)"
        required: false
        default: "false"
      quick_test_seconds:
        description: "برای تست سریع: چند ثانیه فقط اجرا شود (خالی=اجرای کامل ۵ ساعت و ۲۰ دقیقه)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: candle-signal-engine
  cancel-in-progress: false   # اجرای قبلی هیچ‌وقت به‌زور لغو نمی‌شه، فقط اجرای جدید صف می‌مونه

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity (for periodic auto-commits)
        run: |
          git config user.name "candle-engine-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run candle engine (continuous loop)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PRIVATE_CHANNEL_ID: ${{ secrets.PRIVATE_CHANNEL_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          FORCE_RUN_ALL: ${{ (github.event.inputs.force_run_all == 'true') && '1' || '' }}
          LOOP_MAX_SECONDS: ${{ github.event.inputs.quick_test_seconds }}
        run: python candle_engine.py

      - name: Final commit (safety net)
        if: always()
        run: |
          git add data/
          if git diff --quiet --cached; then
            echo "no changes"
          else
            git commit -m "update candle state [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
