name: Candle Signal Engine

on:
  schedule:
    - cron: "*/5 * * * *"   # هر ۵ دقیقه بیدار می‌شود؛ خودِ is_timeframe_due تصمیم می‌گیرد کدام تایم‌فریم‌ها الان باید چک شوند
  workflow_dispatch:
    inputs:
      force_run_all:
        description: "اجرای فوری صرف‌نظر از ساعت (برای تست)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: candle-signal-engine
  cancel-in-progress: false   # اگه اجرای قبلی هنوز فعاله، اجرای جدید صف می‌مونه (لغو نمی‌شه) تا هیچ پیشرفتی از دست نره

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # حفاظت اضافه؛ اسکریپت خودش با MAX_RUN_SECONDS حدود ۴ دقیقه محدود می‌شود
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run candle engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PRIVATE_CHANNEL_ID: ${{ secrets.PRIVATE_CHANNEL_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FORCE_RUN_ALL: ${{ (github.event.inputs.force_run_all == 'true') && '1' || '' }}
        run: python candle_engine.py

      - name: Commit updated state
        run: |
          git config user.name "candle-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candle_state.json data/trade_history.json
          if git diff --quiet --cached; then
            echo "no changes"
          else
            git commit -m "update candle state [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
