name: Candle Signal Engine

# ⚠️ این ورک‌فلو پیوسته تا حدود ۵ ساعت و ۲۰ دقیقه اجرا می‌ماند: یک اتصال WebSocket زنده به
# Coinbase برای بیت‌کوین/اتریوم نگه می‌دارد (دقت چند ثانیه‌ای، بدون هیچ هزینه‌ی API) و هر
# ۵ دقیقه یک دور اسکن کامل (سیگنال جدید + رهگیری REST طلا) هم انجام می‌دهد.
#
# 🔴 رفعِ باگِ واقعیِ «ربات گاهی قطع می‌شود و باید دستی از Actions دوباره ران بشه»:
# طراحی قبلی فقط به فاصله‌ی cron (۵ ساعت) کوتاه‌تر از مدت هر اجرا (۵ ساعت و ۲۰ دقیقه) تکیه
# داشت - یعنی وقتی تریگر بعدی باید برسه، اجرای قبلی هنوز فعاله و در صف قرار می‌گیره
# (concurrency). این تئوری فقط وقتی درسته که خودِ تریگر cron دقیقاً/نزدیک به موقع برسه. اما
# GitHub رسماً اعلام کرده: «schedule می‌تونه در بارهای بالای سیستم Actions با تاخیر زیاد
# اجرا بشه یا حتی کلاً رد بشه» - و این تاخیر دقیقاً در ابتدای هر ساعت (دقیقه‌ی صفر) بیشترین
# احتماله، چون هزاران ورک‌فلوی دیگه هم دقیقاً همون لحظه تریگر می‌خوان. این cron قبلاً دقیقاً
# روی دقیقه‌ی صفر بود ("0 */5 * * *") - یعنی همیشه درست روی شلوغ‌ترین لحظه‌ی ممکن. وقتی این
# تاخیر از ~۲۰ دقیقه مارجین (۵ ساعت و ۲۰ دقیقه منهای ۵ ساعت) بیشتر بشه، اجرای قبلی از قبل
# طبیعی تموم شده و دیگه چیزی برای صف‌شدن پشتش نیست - دقیقاً همون شکاف واقعی که رخ داد.
#
# راه‌حل قطعی (نه فقط کاهش احتمال): self-chaining. همون اولِ هر اجرا (نه انتهاش، تا حتی اگه
# خودِ این اجرا هر دلیلی زود کرش/هنگ کنه هم اجرای بعدی از قبل صف شده باشه)، از طریق GitHub
# API خودش اجرای بعدیِ همین ورک‌فلو رو مستقیم دیسپچ می‌کنه - کاملاً مستقل از قابل‌اعتماد بودن
# زمان‌بندیِ cron. چون concurrency (پایین‌تر) با cancel-in-progress: false تنظیمه، این اجرای
# جدید فقط صف می‌مونه تا اجرای فعلی تموم بشه، بعد بلافاصله (بدون هیچ شکاف) شروع می‌شه - یک
# زنجیره‌ی پیوسته که اصلاً به دقت/تاخیر cron وابسته نیست. cron همچنان به‌عنوان یک پشتیبانِ
# دوم نگه داشته شده (برای حالت نادری که خودِ این زنجیره به هر دلیلی پاره بشه)، ولی از دقیقه‌ی
# صفر جابه‌جا شده (دقیقه‌ی ۱۳) تا حتی همون پشتیبان هم کمتر گرفتار شلوغیِ ابتدای ساعت بشه.
#
# ⚠️ ADMIN_USER_IDS (همون سکرتی که subscription_bot.yml هم استفاده می‌کنه) رو اینجا هم اضافه
# کردیم: اگه یک استثنای غیرمنتظره توی حلقه‌ی اصلی رخ بده، جدا از لاگ Actions، مستقیم به
# ادمین(ها) هم پیام تلگرام می‌فرسته - چون لاگ Actions معمولاً کسی رصد نمی‌کنه.

on:
  schedule:
    - cron: "13 */5 * * *"   # پشتیبانِ دوم - self-chain پایین‌تر منبع اصلی تداومه، این فقط برای حالتی که زنجیره پاره بشه
  workflow_dispatch:
    inputs:
      force_run_all:
        description: "اجرای فوری صرف‌نظر از ساعت (برای تست)"
        required: false
        default: "false"
      quick_test_seconds:
        description: "برای تست سریع: چند ثانیه فقط اجرا شود (خالی=اجرای کامل ۵ ساعت و ۲۰ دقیقه)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write   # 🔴 لازم برای گام «Queue next run» پایین‌تر (فراخوانی workflow_dispatch از طریق GITHUB_TOKEN)

concurrency:
  group: candle-signal-engine
  cancel-in-progress: false   # اجرای قبلی هیچ‌وقت به‌زور لغو نمی‌شه، فقط اجرای جدید صف می‌مونه

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      # 🔴 گام اول و بدون قید و شرط - عمداً همین‌جا، قبل از هر کار دیگه‌ای: تضمین می‌کنه که
      # صرف‌نظر از اینکه بقیه‌ی این اجرا چطور پیش بره (موفق/کرش/هنگ/timeout)، اجرای بعدی از
      # همین الان صف شده و منتظره. continue-on-error چون اگه همین یک گام (مثلاً به‌خاطر یک
      # مشکل موقتِ API گیت‌هاب) شکست بخوره، نباید کل اجرای واقعی (سیگنال‌دهی زنده) رو با خودش
      # متوقف کنه - در بدترین حالت، پشتیبان cron (بالا) بالاخره جبران می‌کنه.
      # 🔴 رفعِ باگِ واقعیِ اینکه این گام قبلاً هیچ‌وقت واقعاً کار نمی‌کرد: چون این گام قبل از
      # «Checkout» اجراست (عمداً، تا حتی اگه بقیه‌ی این اجرا زود کرش کنه هم اجرای بعدی صف
      # شده باشه)، هیچ ریپوی گیت‌ای روی دیسک نیست که دستور `gh` بتونه owner/repo رو ازش
      # حدس بزنه (gh معمولاً این رو از remote گیت پوشه‌ی جاری تشخیص می‌ده). بدون flag صریح
      # `-R`، این دستور با خطای «unable to determine current repository» شکست می‌خورد - و
      # چون continue-on-error: true بود، این شکست کاملاً بی‌صدا بود (نه در لاگ برجسته، نه به
      # کسی اطلاع داده می‌شد) - یعنی زنجیره‌ی self-chain در عمل هیچ‌وقت واقعاً کار نمی‌کرد،
      # دقیقاً همون چیزی که باعث شد مشکل بعد از این فیکس هم ادامه پیدا کنه. الان با
      # `-R "${{ github.repository }}"` (که از context پیش‌فرض Actions میاد، نیازی به
      # checkout نداره) صریحاً ریپو رو مشخص می‌کنیم؛ و اگه با همه‌ی این‌ها باز هم شکست بخوره،
      # به‌جای بی‌صدا رد شدن، یک ::warning:: annotation ثبت می‌شه که در خلاصه‌ی همون اجرا در
      # تب Actions با علامت زرد دیده می‌شه - تا این‌بار اگه چیزی خراب بود واقعاً دیده بشه.
      - name: Queue next run (self-chain — doesn't depend on cron timing)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "candle_signals.yml" \
            --ref "${{ github.ref_name }}" \
            -R "${{ github.repository }}" \
            || echo "::warning::Self-chain failed to queue the next run — relying on the cron backup this cycle."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity (for periodic auto-commits)
        run: |
          git config user.name "candle-engine-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run candle engine (continuous loop)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PRIVATE_CHANNEL_ID: ${{ secrets.PRIVATE_CHANNEL_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          FORCE_RUN_ALL: ${{ (github.event.inputs.force_run_all == 'true') && '1' || '' }}
          LOOP_MAX_SECONDS: ${{ github.event.inputs.quick_test_seconds }}
        run: python candle_engine.py

      - name: Final commit (safety net)
        if: always()
        run: |
          git add data/
          if git diff --quiet --cached; then
            echo "no changes"
          else
            git commit -m "update candle state [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
