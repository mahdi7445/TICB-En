name: Deploy Mini-App (GitHub Pages)

# مینی‌اپ Auto Trading (پوشه‌ی docs/) یک سایت استاتیک است و برای آنلاین ماندن هیچ ورک‌فلوی همیشه‌روشنی نیاز ندارد.
# قبلاً Pages به‌صورت «Deploy from a branch» بود و GitHub روی هر push (از جمله کامیت‌های داده‌ی ربات‌ها) یک
# «pages build and deployment» جدا اجرا می‌کرد ⇒ ده‌ها اجرای پشت‌سرهم. این ورک‌فلو فقط وقتی docs/ تغییر کند
# (یا دستی) اجرا می‌شود و کامیت‌های data/ هرگز آن را راه نمی‌اندازند.
# یک‌بار تنظیم لازم: Settings → Pages → Build and deployment → Source = «GitHub Actions».

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Stage site (keeps the same URL path /docs/autotrade/)"
        run: |
          mkdir -p _site
          cp -r docs _site/docs
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
