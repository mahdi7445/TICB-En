# LOW-TIMEFRAME round (1m / 5m / 15m / 1h) on LONG history and 28 symbols.
# Tests (a) the user's hidden-divergence idea with BIG swing thresholds (4.5 / 6 / 9 ATR) - the size at which it worked on 4h,
#       (b) the simplified two-leg family (TS1/TS2/TS3/TL2L) with 3-4x more trades than before, (c) HDV/HDV3 for reference.
# Same strict PASS rules as always (t>=4, both halves, last 20%, >=50% symbols). Output: artifact "lowtf-report".
name: Strategy lab low timeframes
on:
  workflow_dispatch:
    inputs:
      fee:
        description: "Round-trip fee+slippage in % of price"
        default: "0.10"
jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        group:
          - { id: s1, symbols: "BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT ADAUSDT" }
          - { id: s2, symbols: "LINKUSDT AVAXUSDT LTCUSDT DOTUSDT ATOMUSDT NEARUSDT" }
          - { id: s3, symbols: "UNIUSDT BCHUSDT ETCUSDT TRXUSDT XLMUSDT FILUSDT" }
          - { id: s4, symbols: "AAVEUSDT ALGOUSDT SANDUSDT ICPUSDT ARBUSDT OPUSDT" }
          - { id: s5, symbols: "INJUSDT SUIUSDT HBARUSDT BATUSDT" }
        tf:
          - { id: 1m, d1: 90, d5: 0, d15: 200 }
          - { id: 5m, d1: 0, d5: 730, d15: 200 }
          - { id: 15m, d1: 0, d5: 0, d15: 2000 }
          - { id: 1h, d1: 0, d5: 0, d15: 2000 }
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Back-test ${{ matrix.tf.id }} / ${{ matrix.group.id }}
        run: python -u strategy_lab.py --fetch ${{ matrix.group.symbols }} --tf ${{ matrix.tf.id }} --days1 ${{ matrix.tf.d1 }} --days5 ${{ matrix.tf.d5 }} --days15 ${{ matrix.tf.d15 }} --days1h ${{ matrix.tf.d15 }} --days4h ${{ matrix.tf.d15 }} --gens HDV HDV3 HDV4 HDV6 HDV9 TS1 TS2 TS3 TL2L ENG --dump part_${{ matrix.tf.id }}_${{ matrix.group.id }}.pkl 2>&1 | tee log_${{ matrix.tf.id }}_${{ matrix.group.id }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tpart-${{ matrix.tf.id }}-${{ matrix.group.id }}
          if-no-files-found: warn
          path: |
            part_*.pkl
            log_*.txt
  merge:
    needs: [part]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - name: Low-timeframe report
        run: |
          python -u strategy_lab.py --merge $(find parts -name 'part_*.pkl' | sort) --fee ${{ github.event.inputs.fee }} --selection lab_selection.json 2>&1 | tee lowtf_report.txt
          for f in $(find parts -name 'log_*.txt' | sort); do echo "=== $f" >> data_logs.txt; grep -E "warn|failed|skipped|candles from" $f >> data_logs.txt || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lowtf-report
          if-no-files-found: warn
          path: |
            lowtf_report.txt
            lab_selection.json
            data_logs.txt
