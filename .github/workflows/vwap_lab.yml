# Manual workflow: runs the VWAP backtest lab on real Binance public candles and prints the report in the log.
# Put this file in .github/workflows/ of the TICB repo, then Actions -> "VWAP lab" -> Run workflow.
name: VWAP lab
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Binance symbols (space separated)"
        default: "BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT"
      days:
        description: "History length in days"
        default: "150"
      fee:
        description: "Round-trip fee+slippage in % of price"
        default: "0.12"
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Selftest (VWAP maths, no-edge world, planted-edge world)
        run: python vwap_backtest.py --selftest
      - name: 5-minute candles
        run: python vwap_backtest.py --fetch ${{ github.event.inputs.symbols }} --tf 5m --days ${{ github.event.inputs.days }} --fee ${{ github.event.inputs.fee }} | tee report_5m.txt
      - name: 15-minute candles
        run: python vwap_backtest.py --fetch ${{ github.event.inputs.symbols }} --tf 15m --days ${{ github.event.inputs.days }} --fee ${{ github.event.inputs.fee }} | tee report_15m.txt
      - uses: actions/upload-artifact@v4
        with: { name: vwap-lab-reports, path: "report_*.txt" }
