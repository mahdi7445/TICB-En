name: Full backtest (all strategies x all timeframes)
concurrency:
  group: full-backtest
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      fee:
        description: "Round-trip fee+slippage in % of price"
        default: "0.10"
permissions:
  contents: read          # فقط می‌خواند؛ هیچ چیزی در مخزن (و ربات‌ها) تغییر نمی‌دهد
jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 6     # سهمیه برای ربات‌های زنده آزاد بماند
      matrix:
        group:
          - { id: s1, symbols: "BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT ADAUSDT" }
          - { id: s2, symbols: "LINKUSDT AVAXUSDT LTCUSDT DOTUSDT ATOMUSDT NEARUSDT" }
          - { id: s3, symbols: "UNIUSDT BCHUSDT ETCUSDT TRXUSDT XLMUSDT FILUSDT" }
          - { id: s4, symbols: "AAVEUSDT ALGOUSDT SANDUSDT ICPUSDT ARBUSDT OPUSDT" }
          - { id: s5, symbols: "INJUSDT SUIUSDT HBARUSDT BATUSDT" }
        tf:
          - { id: 5m,  d1: 0,  d5: 730,  d15: 200 }     # اولویت اصلی
          - { id: 15m, d1: 0,  d5: 0,    d15: 2000 }
          - { id: 1h,  d1: 0,  d5: 0,    d15: 2000 }
          - { id: 4h,  d1: 0,  d5: 0,    d15: 2000 }
          - { id: 1m,  d1: 90, d5: 0,    d15: 200 }
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Run ${{ matrix.tf.id }} / ${{ matrix.group.id }}
        run: python -u full_backtest.py run --fetch ${{ matrix.group.symbols }} --tf ${{ matrix.tf.id }} --days1 ${{ matrix.tf.d1 }} --days5 ${{ matrix.tf.d5 }} --days15 ${{ matrix.tf.d15 }} --days1h ${{ matrix.tf.d15 }} --days4h ${{ matrix.tf.d15 }} --fee ${{ github.event.inputs.fee }} --dump part_${{ matrix.tf.id }}_${{ matrix.group.id }}.pkl 2>&1 | tee log_${{ matrix.tf.id }}_${{ matrix.group.id }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fbpart-${{ matrix.tf.id }}-${{ matrix.group.id }}
          if-no-files-found: warn
          path: |
            part_*.pkl
            log_*.txt
  merge:
    needs: [part]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - name: Analyse
        run: python -u full_backtest.py merge $(find parts -name 'part_*.pkl' | sort) --fee ${{ github.event.inputs.fee }} --out-dir full_backtest_out 2>&1 | tail -n 400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-backtest-report
          path: full_backtest_out/
