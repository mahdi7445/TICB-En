name: Full backtest (all strategies x all timeframes, + inverse + stop fixes)
concurrency:
  group: full-backtest
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      fee:
        description: "Round-trip fee+slippage in % of price"
        default: "0.10"
      inverse:
        description: "Also test INV_<strategy> (mirrored) variants (true/false)"
        default: "true"
      ext_stops:
        description: "Also test new stop policies F100/F150/A2 (true/false)"
        default: "true"
permissions:
  contents: read          # فقط می‌خواند؛ هیچ چیزی در مخزن (و ربات‌ها) تغییر نمی‌دهد
jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 10    # سهمیه برای ربات‌های زنده آزاد بماند
      matrix:
        group:
          - { id: g01, symbols: "BTCUSDT ETHUSDT SOLUSDT" }
          - { id: g02, symbols: "XRPUSDT DOGEUSDT ADAUSDT" }
          - { id: g03, symbols: "LINKUSDT AVAXUSDT LTCUSDT" }
          - { id: g04, symbols: "DOTUSDT ATOMUSDT NEARUSDT" }
          - { id: g05, symbols: "UNIUSDT BCHUSDT ETCUSDT" }
          - { id: g06, symbols: "TRXUSDT XLMUSDT FILUSDT" }
          - { id: g07, symbols: "AAVEUSDT ALGOUSDT SANDUSDT" }
          - { id: g08, symbols: "ICPUSDT ARBUSDT OPUSDT" }
          - { id: g09, symbols: "INJUSDT SUIUSDT" }
          - { id: g10, symbols: "HBARUSDT BATUSDT" }
        tf:
          - { id: 5m,  d1: 0,  d5: 730,  d15: 200 }     # اولویت اصلی
          - { id: 15m, d1: 0,  d5: 0,    d15: 2000 }
          - { id: 1h,  d1: 0,  d5: 0,    d15: 2000 }
          - { id: 4h,  d1: 0,  d5: 0,    d15: 2000 }
          - { id: 1m,  d1: 90, d5: 0,    d15: 200 }
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Run ${{ matrix.tf.id }} / ${{ matrix.group.id }}
        shell: bash
        run: |
          FLAGS=""
          [ "${{ github.event.inputs.inverse }}" = "false" ] && FLAGS="$FLAGS --no-inverse"
          [ "${{ github.event.inputs.ext_stops }}" = "false" ] && FLAGS="$FLAGS --no-ext-stops"
          python -u full_backtest.py run --fetch ${{ matrix.group.symbols }} --tf ${{ matrix.tf.id }} \
            --days1 ${{ matrix.tf.d1 }} --days5 ${{ matrix.tf.d5 }} --days15 ${{ matrix.tf.d15 }} \
            --days1h ${{ matrix.tf.d15 }} --days4h ${{ matrix.tf.d15 }} --fee ${{ github.event.inputs.fee }} $FLAGS \
            --dump part_${{ matrix.tf.id }}_${{ matrix.group.id }}.pkl 2>&1 | tee log_${{ matrix.tf.id }}_${{ matrix.group.id }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fbpart-${{ matrix.tf.id }}-${{ matrix.group.id }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            part_*.pkl
            log_*.txt
  merge:
    needs: [part]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: "fbpart-*" }
      - name: Analyse
        shell: bash
        run: |
          ls -la parts/*/part_*.pkl | head -60
          python -u full_backtest.py merge $(find parts -name 'part_*.pkl' | sort) --fee ${{ github.event.inputs.fee }} --out-dir full_backtest_out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-backtest-report
          path: full_backtest_out/
